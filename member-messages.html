<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="forms.css" />
  <script src="env-config.js" defer></script>
</head>
<body>
  <button type="button" class="back-button" onclick="if (document.referrer && document.referrer.indexOf(location.host) !== -1 && document.referrer !== location.href) { history.back(); } else { location.href = 'member-dashboard.html'; }">&larr; Back</button>
    <div class="mobile-topbar">
    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
    <span class="mobile-topbar-brand" id="mobileBrand">Menu</span>
  </div>

  <div class="dashboard-layout">
    <aside class="dashboard-sidebar" id="dashboardSidebar">
      <div class="brand" id="sidebarBrand">MY TOWN TECH</div>
      <nav>
        <a href="member-dashboard.html">Overview</a>
        <a href="member-profile.html">My Profile</a>
        <a href="member-connections.html">Connections</a>
        <a href="member-messages.html" class="active">Messages</a>
        <a href="member-opportunities.html">Opportunities</a>
        <a href="member-events.html">Events</a>
        <a href="member-mentorship.html">Mentorship</a>
        <a href="member-settings.html">Settings</a>
        <a href="index.html" style="border-top:1px solid var(--color-border);margin-top:8px;padding-top:14px;">Home</a>
        <a href="admin-dashboard.html" id="switchToAdminLink" hidden style="border-top:1px solid var(--color-border);margin-top:8px;padding-top:14px;">Switch to Admin View</a>
      </nav>
    </aside>

    <main class="dashboard-main" style="max-width:900px;">
      <h1>Messages</h1>
      <p class="placeholder-text" style="margin-bottom:16px;">You can only message members you're connected with.</p>

      <div class="messages-layout">
        <div class="conversation-list" id="conversationList">
          <p class="placeholder-text" style="padding:14px;">Loading…</p>
        </div>

        <div class="thread-panel" id="threadPanel">
          <p class="placeholder-text" style="padding:20px;">Select a connection to start messaging.</p>
        </div>
      </div>
    </main>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script type="module">
    import { requireRole } from './auth.js';
    import { supabase } from './supabase-client.js';
    import {applySidebarBrand, escapeHtml, VERIFIED_BADGE_SVG, initMobileSidebarToggle} from './utils.js';
    applySidebarBrand(supabase);
    initMobileSidebarToggle();

    const profile = await requireRole(['member', 'mentor', 'organization', 'admin', 'super_admin']);
    if (!profile) throw new Error('Not authorized');

    if (['admin', 'super_admin'].includes(profile.role)) {
      const switchLink = document.getElementById('switchToAdminLink');
      if (switchLink) switchLink.hidden = false;
    }

    let activeConnectionId = null;
    let connections = [];
    let typingChannel = null;
    let typingTimeout = null;
    let lastTypingSent = 0;

    function defaultAvatar() {
      return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231A2332'/%3E%3Ccircle cx='50' cy='38' r='18' fill='%23374151'/%3E%3Cpath d='M20 88c0-22 14-36 30-36s30 14 30 36' fill='%23374151'/%3E%3C/svg%3E";
    }

    async function loadConnections() {
      const { data, error } = await supabase
        .from('connections')
        .select('id, requester_id, addressee_id, profiles!connections_requester_id_fkey(id, username, full_name, profile_photo_url, is_verified), addressee:profiles!connections_addressee_id_fkey(id, username, full_name, profile_photo_url, is_verified)')
        .eq('status', 'accepted')
        .or(`requester_id.eq.${profile.id},addressee_id.eq.${profile.id}`);

      const list = document.getElementById('conversationList');
      if (error || !data || data.length === 0) {
        list.innerHTML = '<p class="placeholder-text" style="padding:14px;">No connections yet. Connect with members from their profile to start messaging.</p>';
        return;
      }

      connections = data.map(c => {
        const other = c.requester_id === profile.id ? c.addressee : c.profiles;
        return { connectionId: c.id, other };
      });

      renderConversationList();

      // Support arriving via ?u=<userId> from a profile page's "Message" link
      const params = new URLSearchParams(window.location.search);
      const targetUserId = params.get('u');
      if (targetUserId) {
        const match = connections.find(c => c.other.id === targetUserId);
        if (match) openThread(match.other.id);
      }
    }

    function renderConversationList() {
      const list = document.getElementById('conversationList');
      list.innerHTML = connections.map(c => `
        <button type="button" class="conversation-item" data-user-id="${c.other.id}">
          <img loading="lazy" src="${c.other.profile_photo_url || defaultAvatar()}" alt="" class="avatar" />
          <span>${escapeHtml(c.other.full_name)} ${c.other.is_verified ? VERIFIED_BADGE_SVG : ''}</span>
          <span class="unread-dot" data-unread-for="${c.other.id}" hidden></span>
        </button>
      `).join('');

      list.querySelectorAll('.conversation-item').forEach(btn => {
        btn.addEventListener('click', () => openThread(btn.dataset.userId));
      });
    }

    function markConversationUnread(senderId) {
      const dot = document.querySelector(`.unread-dot[data-unread-for="${senderId}"]`);
      if (dot) dot.hidden = false;
    }

    function clearConversationUnread(senderId) {
      const dot = document.querySelector(`.unread-dot[data-unread-for="${senderId}"]`);
      if (dot) dot.hidden = true;
    }

    async function openThread(otherUserId) {
      activeConnectionId = otherUserId;
      document.querySelectorAll('.conversation-item').forEach(b => b.classList.toggle('active', b.dataset.userId === otherUserId));
      clearConversationUnread(otherUserId);

      const other = connections.find(c => c.other.id === otherUserId)?.other;
      const panel = document.getElementById('threadPanel');
      panel.innerHTML = `
        <div class="thread-header">${escapeHtml(other?.full_name || '')} ${other?.is_verified ? VERIFIED_BADGE_SVG : ''}</div>
        <div class="thread-messages" id="threadMessages"><p class="placeholder-text" style="padding:14px;">Loading…</p></div>
        <p class="typing-indicator" id="typingIndicator" hidden>${escapeHtml(other?.full_name || 'They')} is typing…</p>
        <form id="messageForm" class="thread-composer">
          <input id="messageInput" placeholder="Type a message…" autocomplete="off" required />
          <button type="submit" class="btn-primary">Send</button>
        </form>
      `;

      await loadMessages(otherUserId);
      subscribeTypingChannel(otherUserId);

      const messageInput = document.getElementById('messageInput');
      messageInput.addEventListener('input', () => {
        const now = Date.now();
        if (now - lastTypingSent > 2000 && typingChannel) {
          lastTypingSent = now;
          typingChannel.send({ type: 'broadcast', event: 'typing', payload: { from: profile.id } });
        }
      });

      document.getElementById('messageForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('messageInput');
        const body = input.value.trim();
        if (!body) return;

        const { data: sent, error } = await supabase.from('messages')
          .insert({ sender_id: profile.id, recipient_id: otherUserId, body })
          .select('id, sender_id, body, created_at')
          .single();

        if (!error) {
          input.value = '';
          if (sent) appendMessageToThread(sent);
        }
      });
    }

    function subscribeTypingChannel(otherUserId) {
      if (typingChannel) supabase.removeChannel(typingChannel);
      const channelName = 'typing-' + [profile.id, otherUserId].sort().join('-');
      typingChannel = supabase.channel(channelName);
      typingChannel
        .on('broadcast', { event: 'typing' }, (payload) => {
          if (payload.payload?.from === otherUserId) showTypingIndicator();
        })
        .subscribe();
    }

    function showTypingIndicator() {
      const el = document.getElementById('typingIndicator');
      if (!el) return;
      el.hidden = false;
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { el.hidden = true; }, 3000);
    }

    function appendMessageToThread(msg) {
      const container = document.getElementById('threadMessages');
      if (!container) return;
      const emptyNotice = container.querySelector('.placeholder-text');
      if (emptyNotice) container.innerHTML = '';
      container.insertAdjacentHTML('beforeend', `
        <div class="message-bubble ${msg.sender_id === profile.id ? 'mine' : 'theirs'}">
          <p>${escapeHtml(msg.body)}</p>
          <span class="message-time">${new Date(msg.created_at).toLocaleString()}</span>
        </div>
      `);
      container.scrollTop = container.scrollHeight;
    }

    async function loadMessages(otherUserId) {
      const { data, error } = await supabase
        .from('messages')
        .select('id, sender_id, body, created_at, read_at')
        .or(`and(sender_id.eq.${profile.id},recipient_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},recipient_id.eq.${profile.id})`)
        .order('created_at', { ascending: true });

      const container = document.getElementById('threadMessages');
      if (error || !data || data.length === 0) {
        container.innerHTML = '<p class="placeholder-text" style="padding:14px;">No messages yet — say hello!</p>';
      } else {
        container.innerHTML = data.map(m => `
          <div class="message-bubble ${m.sender_id === profile.id ? 'mine' : 'theirs'}">
            <p>${escapeHtml(m.body)}</p>
            <span class="message-time">${new Date(m.created_at).toLocaleString()}</span>
          </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
      }

      // Mark unread messages from the other person as read
      const unreadIds = (data || []).filter(m => m.sender_id === otherUserId && !m.read_at).map(m => m.id);
      if (unreadIds.length) {
        await supabase.from('messages').update({ read_at: new Date().toISOString() }).in('id', unreadIds);
      }
    }

    function setupRealtimeInbox() {
      supabase
        .channel('messages-inbox-' + profile.id)
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'messages',
          filter: `recipient_id=eq.${profile.id}`,
        }, (payload) => {
          const msg = payload.new;
          if (activeConnectionId === msg.sender_id) {
            appendMessageToThread(msg);
            supabase.from('messages').update({ read_at: new Date().toISOString() }).eq('id', msg.id);
          } else {
            markConversationUnread(msg.sender_id);
          }
        })
        .subscribe();
    }

    loadConnections();
    setupRealtimeInbox();
  </script>
  <style>
    .messages-layout {
      display: flex;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      overflow: hidden;
      height: 65vh;
      min-height: 400px;
    }
    .conversation-list {
      width: 240px;
      flex-shrink: 0;
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
      background: var(--color-surface);
    }
    .conversation-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      background: none;
      border: none;
      border-bottom: 1px solid var(--color-border);
      color: var(--color-text);
      font-family: inherit;
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
    }
    .conversation-item:hover, .conversation-item.active { background: var(--color-surface-2); }
    .conversation-item .avatar { width: 32px; height: 32px; margin-bottom: 0; }
    .conversation-item { position: relative; }
    .unread-dot {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--color-accent);
    }
    .thread-panel { flex: 1; display: flex; flex-direction: column; background: var(--color-bg); }
    .thread-header { padding: 14px 18px; border-bottom: 1px solid var(--color-border); font-weight: 600; }
    .thread-messages { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
    .message-bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; }
    .message-bubble.mine { align-self: flex-end; background: var(--color-primary); color: #fff; }
    .message-bubble.theirs { align-self: flex-start; background: var(--color-surface-2); border: 1px solid var(--color-border); }

    @media (max-width: 700px) {
      .messages-layout { flex-direction: column; height: auto; min-height: 0; }
      .conversation-list {
        width: 100%;
        max-height: 160px;
        display: flex;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        border-right: none;
        border-bottom: 1px solid var(--color-border);
      }
      .conversation-item {
        flex-direction: column;
        gap: 6px;
        width: auto;
        min-width: 84px;
        text-align: center;
        border-bottom: none;
        border-right: 1px solid var(--color-border);
        padding: 10px 12px;
        font-size: 0.75rem;
      }
      .conversation-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
      .thread-panel { height: 60vh; }
      .message-bubble { max-width: 85%; }
    }
    .message-bubble p { margin: 0; }
    .message-time { display: block; font-size: 0.7rem; opacity: 0.7; margin-top: 4px; }
    .thread-composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--color-border); }
    .thread-composer input { flex: 1; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 8px; padding: 10px 12px; color: var(--color-text); font-family: inherit; }
    .typing-indicator {
      padding: 4px 18px;
      margin: 0;
      font-size: 0.78rem;
      font-style: italic;
      color: var(--color-text-muted);
    }
  </style>
</body>
</html>
